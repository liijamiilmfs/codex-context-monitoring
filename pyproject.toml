[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "codex-context-monitoring"
version = "0.1.0"
description = "Analyze and visualize Codex session usage metrics."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "coverage[toml]",
    "pytest",
    "pytest-mock",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: opt-in tests that exercise real external dependencies",
]
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
source = ["codex_context_monitoring"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
exclude = ["CHANGELOG.md"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.src]
include = ["src", "tests"]
